name: Measure Cloud Cuckoo qualification

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      source_sha:
        description: Full SHA of the accepted warning-free main merge to measure
        required: true
        type: string

permissions: {}
concurrency:
  group: cloud-cuckoo-source-evidence-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  executor-controls:
    if: github.repository == 'open-hax/cloud-cuckoo'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.9.5'
      - name: Install hash-locked native tools outside source
        env:
          TESTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          mkdir -m 700 "$RUNNER_TEMP/control-home" "$RUNNER_TEMP/control-evidence"
          test "$(git rev-parse HEAD)" = "$TESTED_SOURCE_SHA"
          printf '%s\n' "$TESTED_SOURCE_SHA" > "$RUNNER_TEMP/control-evidence/source-sha.txt"
          git ls-files -z | xargs -0 sha256sum > "$RUNNER_TEMP/control-evidence/tracked-source.sha256"
          env -i PATH="$PATH" HOME="$RUNNER_TEMP/control-home" LANG=C.UTF-8 \
            UV_CACHE_DIR="$RUNNER_TEMP/tool-cache" uv venv --python 3.13 "$RUNNER_TEMP/tool-venv"
          env -i PATH="$PATH" HOME="$RUNNER_TEMP/control-home" LANG=C.UTF-8 \
            UV_CACHE_DIR="$RUNNER_TEMP/tool-cache" uv pip install \
            --python "$RUNNER_TEMP/tool-venv/bin/python" --require-hashes -r qualification/tools.lock
      - name: Run synthetic controls and a real session-escaped descendant containment control
        run: |
          (sudo systemd-run --wait --pipe --collect \
            --unit="cloud-executor-controls-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --uid="$(id -u)" --gid="$(id -g)" --working-directory="$GITHUB_WORKSPACE" \
            --property=MemoryMax=2147483648 --property=MemorySwapMax=0 \
            --property=CPUQuota=200% --property=TasksMax=128 --property=RuntimeMaxSec=480 \
            /usr/bin/env -i PATH="$PATH" HOME="$RUNNER_TEMP/control-home" LANG=C.UTF-8 \
            PYTHONDONTWRITEBYTECODE=1 PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 \
            "$RUNNER_TEMP/tool-venv/bin/python" -B -m pytest -q -c /dev/null \
            -p no:cacheprovider qualification/test_native_executor.py \
            --basetemp="$RUNNER_TEMP/control-evidence/cases" \
            --junitxml="$RUNNER_TEMP/control-evidence/tests.xml") \
            > "$RUNNER_TEMP/control-evidence/stdout.txt" 2> "$RUNNER_TEMP/control-evidence/stderr.txt" || {
              cat "$RUNNER_TEMP/control-evidence/stdout.txt" "$RUNNER_TEMP/control-evidence/stderr.txt"
              exit 1
            }
          env -i PATH="$PATH" HOME="$RUNNER_TEMP/control-home" LANG=C.UTF-8 \
            "$RUNNER_TEMP/tool-venv/bin/python" -I -B qualification/native_executor.py \
            containment-control --output "$RUNNER_TEMP/control-evidence/kernel-containment"
          sha256sum --check "$RUNNER_TEMP/control-evidence/tracked-source.sha256"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: cloud-cuckoo-executor-controls-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/control-evidence/
          if-no-files-found: error
          retention-days: 14

  measure:
    needs: executor-controls
    if: github.repository == 'open-hax/cloud-cuckoo' && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: read
      pull-requests: read
    strategy:
      fail-fast: false
      matrix:
        partition: [0, 1, 2, 3]
    env:
      PARTITION: ${{ matrix.partition }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.9.5'
      - name: Admit native merged source with the existing source publisher reader
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          mkdir -m 700 "$RUNNER_TEMP/native-evidence" "$RUNNER_TEMP/native-evidence/intake-$PARTITION"
          python3 -I -B scripts/release_image.py admit \
            --source-sha "$SOURCE_SHA" --checkout "$GITHUB_WORKSPACE" \
            --archive "$RUNNER_TEMP/native-evidence/intake-$PARTITION/source.tar" \
            --test-directory "$RUNNER_TEMP/admitted-archive-source" \
            --receipt "$RUNNER_TEMP/native-evidence/intake-$PARTITION/source-admission.json"
      - name: Prepare an exclusive immutable application clone and external environments without credentials
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          mkdir -m 700 "$RUNNER_TEMP/qualification-home"
          env -i PATH="$PATH" HOME="$RUNNER_TEMP/qualification-home" LANG=C.UTF-8 \
            git clone --no-local --no-checkout "$GITHUB_WORKSPACE" "$RUNNER_TEMP/application"
          env -i PATH="$PATH" HOME="$RUNNER_TEMP/qualification-home" LANG=C.UTF-8 \
            git -C "$RUNNER_TEMP/application" checkout --detach "$SOURCE_SHA"
          env -i PATH="$PATH" HOME="$RUNNER_TEMP/qualification-home" LANG=C.UTF-8 \
            UV_CACHE_DIR="$RUNNER_TEMP/uv-cache" TMPDIR="$RUNNER_TEMP" \
            UV_PROJECT_ENVIRONMENT="$RUNNER_TEMP/application-venv" \
            uv sync --project "$RUNNER_TEMP/application" --frozen --extra test --no-editable --python 3.13
          env -i PATH="$PATH" HOME="$RUNNER_TEMP/qualification-home" LANG=C.UTF-8 \
            UV_CACHE_DIR="$RUNNER_TEMP/uv-cache" uv venv --python 3.13 "$RUNNER_TEMP/tool-venv"
          env -i PATH="$PATH" HOME="$RUNNER_TEMP/qualification-home" LANG=C.UTF-8 \
            UV_CACHE_DIR="$RUNNER_TEMP/uv-cache" uv pip install \
            --python "$RUNNER_TEMP/tool-venv/bin/python" --require-hashes -r qualification/tools.lock
      - name: Freeze all native proposals then measure one complete disjoint group
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          # The trusted controller has 512MiB/one CPU. Each invocation has its
          # own 1536MiB/one CPU cgroup, swap zero: total at most 2GiB/two CPUs.
          sudo systemd-run --wait --pipe --collect \
            --unit="cloud-native-controller-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-$PARTITION" \
            --uid="$(id -u)" --gid="$(id -g)" --working-directory="$GITHUB_WORKSPACE" \
            --property=MemoryMax=536870912 --property=MemorySwapMax=0 \
            --property=CPUQuota=100% --property=TasksMax=128 --property=RuntimeMaxSec=21000 \
            /usr/bin/env -i PATH="$PATH" HOME="$RUNNER_TEMP/qualification-home" LANG=C.UTF-8 \
            EVIDENCE="$RUNNER_TEMP/native-evidence" PARTITION="$PARTITION" SOURCE_SHA="$SOURCE_SHA" \
            APPLICATION="$RUNNER_TEMP/application" APP_PYTHON="$RUNNER_TEMP/application-venv/bin/python" \
            TOOL_PYTHON="$RUNNER_TEMP/tool-venv/bin/python" CONTROLLER="$GITHUB_WORKSPACE" \
            /bin/sh -eu -c '
              "$TOOL_PYTHON" -I -B "$CONTROLLER/qualification/native_inventory.py" \
                --root "$APPLICATION" --source-sha "$SOURCE_SHA" \
                --tool-lock "$CONTROLLER/qualification/tools.lock" --output "$EVIDENCE/inventory-$PARTITION"
              "$TOOL_PYTHON" -I -B "$CONTROLLER/qualification/native_executor.py" partition \
                --root "$APPLICATION" --source-sha "$SOURCE_SHA" \
                --inventory "$EVIDENCE/inventory-$PARTITION" --tool-lock "$CONTROLLER/qualification/tools.lock" \
                --python "$APP_PYTHON" --output "$EVIDENCE/partition-$PARTITION" --partition "$PARTITION"
            '
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: cloud-cuckoo-native-evidence-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.partition }}
          path: ${{ runner.temp }}/native-evidence/
          if-no-files-found: error
          compression-level: 1
          retention-days: 14

  collect:
    needs: measure
    if: github.repository == 'open-hax/cloud-cuckoo' && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && !cancelled()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: cloud-cuckoo-native-evidence-${{ github.run_id }}-${{ github.run_attempt }}-*
          path: ${{ runner.temp }}/native-evidence
          merge-multiple: true
          digest-mismatch: error
      - name: Collect actual four-group measurements without granting production admission
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          python3 -I -B qualification/native_executor.py aggregate \
            --directory "$RUNNER_TEMP/native-evidence" --source-sha "$SOURCE_SHA" \
            --output "$RUNNER_TEMP/native-evidence/campaign.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: cloud-cuckoo-native-campaign-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/native-evidence/
          if-no-files-found: error
          compression-level: 1
          retention-days: 14
