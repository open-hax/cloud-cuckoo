name: Observe Cloud Cuckoo package metadata

on:
  workflow_dispatch:

permissions: {}

jobs:
  observe:
    if: github.repository == 'open-hax/cloud-cuckoo' && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          path: controller
      - name: Read exact package visibility without registry writes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 controller/scripts/release_image.py probe --output "$RUNNER_TEMP/package-probe.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: cloud-cuckoo-package-probe-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/package-probe.json
          if-no-files-found: warn
          retention-days: 7
