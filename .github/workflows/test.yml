name: Test Cloud Cuckoo source

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    if: github.repository == 'open-hax/cloud-cuckoo'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.9.5'
      - name: Install locked application and test dependencies without credentials
        env:
          TESTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          mkdir -m 700 "$RUNNER_TEMP/test-home" "$RUNNER_TEMP/test-evidence"
          test "$(git rev-parse HEAD)" = "$TESTED_SOURCE_SHA"
          printf '%s\n' "$TESTED_SOURCE_SHA" > "$RUNNER_TEMP/test-evidence/source-sha.txt"
          git ls-files -z | xargs -0 sha256sum > "$RUNNER_TEMP/test-evidence/tracked-source.sha256"
          env -i PATH="$PATH" HOME="$RUNNER_TEMP/test-home" LANG=C.UTF-8 \
            UV_CACHE_DIR="$RUNNER_TEMP/uv-cache" TMPDIR="$RUNNER_TEMP" \
            uv sync --frozen --extra test --python 3.13
      - name: Check cold runtime imports without credentials
        run: |
          evidence="$RUNNER_TEMP/test-evidence/cold"
          mkdir -m 700 "$evidence" "$evidence/python-cache"
          (sudo systemd-run --quiet --wait --pipe --collect \
            --unit="cloud-cuckoo-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-cold" \
            --uid="$(id -u)" --gid="$(id -g)" --working-directory="$GITHUB_WORKSPACE" \
            --property=MemoryMax=2147483648 --property=MemorySwapMax=0 \
            --property=CPUQuota=200% --property=TasksMax=128 --property=RuntimeMaxSec=120 \
            /usr/bin/env -i PATH="$PATH" HOME="$RUNNER_TEMP/test-home" LANG=C.UTF-8 \
            PYTHONDONTWRITEBYTECODE=1 \
            "$GITHUB_WORKSPACE/.venv/bin/python" -B -X "pycache_prefix=$evidence/python-cache" \
            -W error -c 'import gc; import knoxx_colab_mcp.server; import knoxx_colab_mcp.oauth; import colab_mcp.websocket_server; import fastmcp.server.auth.providers.jwt; gc.collect()') \
            > "$evidence/stdout.txt" 2> "$evidence/stderr.txt" || {
              cat "$evidence/stdout.txt" "$evidence/stderr.txt"
              exit 1
            }
          test ! -s "$evidence/stderr.txt" || { cat "$evidence/stderr.txt"; exit 1; }
      - name: Run adapter controls and the complete source suite with bounded resources
        run: |
          for phase in controls suite; do
            evidence="$RUNNER_TEMP/test-evidence/$phase"
            mkdir -m 700 "$evidence" "$evidence/python-cache"
            target=tests
            if [ "$phase" = controls ]; then target=tests/test_pytest_evidence.py; fi
            (sudo systemd-run --quiet --wait --pipe --collect \
              --unit="cloud-cuckoo-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-$phase" \
              --uid="$(id -u)" --gid="$(id -g)" --working-directory="$GITHUB_WORKSPACE" \
              --property=MemoryMax=2147483648 --property=MemorySwapMax=0 \
              --property=CPUQuota=200% --property=TasksMax=128 --property=RuntimeMaxSec=600 \
              /usr/bin/env -i PATH="$PATH" HOME="$RUNNER_TEMP/test-home" LANG=C.UTF-8 \
              PYTHONDONTWRITEBYTECODE=1 PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 \
              "$GITHUB_WORKSPACE/.venv/bin/python" -B -X "pycache_prefix=$evidence/python-cache" \
              -W error -m pytest -q -W error -p pytest_asyncio.plugin "$target" \
              --basetemp="$evidence/cases" --junitxml="$evidence/tests.xml") \
              > "$evidence/stdout.txt" 2> "$evidence/stderr.txt" || {
                cat "$evidence/stdout.txt" "$evidence/stderr.txt"
                exit 1
              }
            cat "$evidence/stdout.txt" "$evidence/stderr.txt"
            test ! -s "$evidence/stderr.txt" || exit 1
          done
          sha256sum --check "$RUNNER_TEMP/test-evidence/tracked-source.sha256"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: cloud-cuckoo-source-tests-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/test-evidence/
          if-no-files-found: error
          retention-days: 7
