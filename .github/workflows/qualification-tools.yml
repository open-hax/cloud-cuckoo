name: Test native qualification tooling

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  native-tool-controls:
    if: github.repository == 'open-hax/cloud-cuckoo'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.9.5'
      - name: Install hash-locked native tools without credentials
        env:
          TESTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          mkdir -m 700 "$RUNNER_TEMP/tool-home" "$RUNNER_TEMP/tool-evidence"
          test "$(git rev-parse HEAD)" = "$TESTED_SOURCE_SHA"
          printf '%s\n' "$TESTED_SOURCE_SHA" > "$RUNNER_TEMP/tool-evidence/source-sha.txt"
          git ls-files -z | xargs -0 sha256sum > "$RUNNER_TEMP/tool-evidence/tracked-source.sha256"
          env -i PATH="$PATH" HOME="$RUNNER_TEMP/tool-home" LANG=C.UTF-8 \
            UV_CACHE_DIR="$RUNNER_TEMP/tool-cache" uv venv --python 3.13 "$RUNNER_TEMP/tool-venv"
          env -i PATH="$PATH" HOME="$RUNNER_TEMP/tool-home" LANG=C.UTF-8 \
            UV_CACHE_DIR="$RUNNER_TEMP/tool-cache" uv pip install \
            --python "$RUNNER_TEMP/tool-venv/bin/python" --require-hashes -r qualification/tools.lock
          cp qualification/tools.lock "$RUNNER_TEMP/tool-evidence/tools.lock"
      - name: Run synthetic native controls in an isolated resource unit
        run: |
          (sudo systemd-run --wait --pipe --collect \
            --unit="cloud-native-controls-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --uid="$(id -u)" --gid="$(id -g)" --working-directory="$GITHUB_WORKSPACE" \
            --property=MemoryMax=2147483648 --property=MemorySwapMax=0 \
            --property=CPUQuota=100% --property=TasksMax=128 --property=RuntimeMaxSec=300 \
            /usr/bin/env -i PATH="$PATH" HOME="$RUNNER_TEMP/tool-home" LANG=C.UTF-8 \
            PYTHONDONTWRITEBYTECODE=1 PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 \
            "$RUNNER_TEMP/tool-venv/bin/python" -B -m pytest -q -c /dev/null \
            -p no:cacheprovider qualification/test_native_inventory.py \
            --basetemp="$RUNNER_TEMP/tool-evidence/cases" \
            --junitxml="$RUNNER_TEMP/tool-evidence/tests.xml") \
            > "$RUNNER_TEMP/tool-evidence/stdout.txt" 2> "$RUNNER_TEMP/tool-evidence/stderr.txt" || {
              cat "$RUNNER_TEMP/tool-evidence/stdout.txt" "$RUNNER_TEMP/tool-evidence/stderr.txt"
              exit 1
            }
          cat "$RUNNER_TEMP/tool-evidence/stdout.txt" "$RUNNER_TEMP/tool-evidence/stderr.txt"
          sha256sum --check "$RUNNER_TEMP/tool-evidence/tracked-source.sha256"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: cloud-cuckoo-native-tool-controls-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/tool-evidence/
          if-no-files-found: error
          retention-days: 7
